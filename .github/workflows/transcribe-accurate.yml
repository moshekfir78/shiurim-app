name: transcribe-accurate
on:
  schedule: [{cron: "*/30 * * * *"}]
  workflow_dispatch:
permissions: {contents: write, issues: write, pages: write, id-token: write}
concurrency: {group: transcribe-accurate, cancel-in-progress: false}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    outputs:
      deploy: ${{ steps.tr.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y -qq ffmpeg >/dev/null && pip install -q requests yt-dlp youtube-transcript-api faster-whisper
      - name: Cache ivrit.ai fast model
        uses: actions/cache@v4
        with: {path: ~/.cache/huggingface/hub/models--ivrit-ai--whisper-large-v3-turbo-ct2, key: hf-ivrit-turbo-ct2}
      - name: Transcribe pending requests
        id: tr
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name shiurim-bot; git config user.email orikfir10@users.noreply.github.com
          python3 build.py >/dev/null
          export WORKER_MODE=accurate JOB_DEADLINE=$(( $(date +%s) + 330*60 ))
          python3 transcribe_worker.py --once
          [ -f .deploy-needed ] && echo "deploy=1" >> $GITHUB_OUTPUT || true
  deploy:
    needs: run
    if: needs.run.outputs.deploy == '1'
    runs-on: ubuntu-latest
    concurrency: {group: pages-deploy, cancel-in-progress: false}
    environment: {name: github-pages}
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - name: Build from latest main
        run: |
          git fetch -q origin main && git reset -q --hard origin/main && git log -1 --oneline
          pip install -q requests && python3 build.py >/dev/null
          SRC_MINUTES=6 SRC_CACHE=/tmp/srccache.json node importers/srclinks.js || echo 'source linking skipped'
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: {path: public}
      - uses: actions/deploy-pages@v4
