name: daily-update
on:
  schedule: [{cron: "30 1 * * *"}]   # 04:30 Israel
  workflow_dispatch:
    inputs:
      quick: {description: "skip importers, only build + deploy", type: boolean, default: false}
permissions: {contents: write, pages: write, id-token: write}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    concurrency: {group: repo-write, cancel-in-progress: false}
    outputs: {deploy: '1'}
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q requests yt-dlp && (sudo apt-get install -y -qq poppler-utils >/dev/null || true)
      - name: Import all sources + build
        run: |
          if [ "${{ inputs.quick }}" = "true" ]; then python3 build.py; else ./ci_update.sh; fi
      - name: Source links cache
        uses: actions/cache@v4
        with: {path: /tmp/srccache.json, key: "srclinks-${{ github.run_id }}", restore-keys: "srclinks-"}
      - name: Link every listed source to its exact place (Sefaria / Wikisource)
        run: SRC_MINUTES=90 SRC_CONC=6 SRC_POOL=6 SRC_GAP=80 SRC_CACHE=/tmp/srccache.json node importers/srclinks.js || echo "::warning::source linking failed"
      - name: YouTube playability check (real embedded player; ~1000 videos a day, sketches and new videos first)
        if: ${{ inputs.quick != true }}
        run: |
          npm i --silent --no-save --prefix /tmp/ytc puppeteer-core@23 >/dev/null 2>&1 || true
          YT_MINUTES=20 node importers/yt_embed_check.js || echo "::warning::youtube check failed"
      - name: Commit data
        run: |
          git config user.name shiurim-bot; git config user.email orikfir10@users.noreply.github.com
          python3 ci_commit.py "daily update $(date -u +%F)" data   # 3-way merge onto latest main; never overwrites newer pushes
      - name: Copies of written shiurim's PDFs for in-app reading (publishers send no CORS; separate `pdf` branch, only missing files)
        run: PDF_MINUTES=40 python3 importers/pdfmirror.py --all || echo "::warning::pdf copies failed"
  deploy:
    needs: run
    runs-on: ubuntu-latest
    concurrency: {group: pages-deploy, cancel-in-progress: false}
    environment: {name: github-pages}
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - name: Build from latest main
        run: |
          git fetch -q origin main && git reset -q --hard origin/main && git log -1 --oneline
          pip install -q requests && (sudo apt-get install -y -qq poppler-utils >/dev/null || true) && python3 build.py >/dev/null
          SRC_MINUTES=6 SRC_CACHE=/tmp/srccache.json node importers/srclinks.js || echo 'source linking skipped'
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: {path: public}
      - uses: actions/deploy-pages@v4
