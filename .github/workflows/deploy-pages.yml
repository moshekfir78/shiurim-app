name: deploy-pages
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'public/*.js'
      - 'public/*.css'
      - 'public/*.html'
      - 'public/sw.js'
      - 'public/manifest.webmanifest'
      - 'public/icons/**'
      - '.github/workflows/deploy-pages.yml'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - name: Build catalog into public
        run: |
          git fetch -q origin main && git reset -q --hard origin/main && git log -1 --oneline
          pip install -q requests && (sudo apt-get install -y -qq poppler-utils >/dev/null || true) && python3 build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: {path: public}
      - id: deployment
        uses: actions/deploy-pages@v4
